on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-security:
    name: 🛡️ Pruebas y Análisis de Seguridad
    runs-on: ubuntu-latest

    steps:
      - name: 1. Descargar Código
        uses: actions/checkout@v4

      - name: 2. Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 3. Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit

      - name: 4. Ejecutar Pruebas Unitarias (Pytest)
        run: |
          pytest app/test_app.py -v

      - name: 5. Análisis de Seguridad SAST (Bandit)
        run: |
          bandit -r app/ -ll -ii

      - name: 6. Construir Imagen Docker
        run: |
          docker build -t evidenciassre-app:latest .

      - name: 7. Escaneo de Vulnerabilidades en Imagen Docker (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'evidenciassre-app:latest'
          format: 'table'
          exit-code: '1' # Interrumpe el pipeline si encuentra vulnerabilidades CRITICAL/HIGH
          severity: 'CRITICAL,HIGH'

  deploy:
    name: 🚀 Despliegue Automático en VPS
    needs: test-and-security
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Conectar por SSH y Desplegar
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/Evidencias.SRE
            git pull origin main
            docker compose down
            docker compose up -d --build